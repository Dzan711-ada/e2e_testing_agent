[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-testing-agent"
version = "0.1.0"
description = "LangGraph web test generation and execution, adapted from GenAI_Agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph==0.2.18",
    "langgraph-checkpoint==1.0.9",
    "langchain-core==0.3.86",
    "langchain-openai==0.3.35",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "typing-extensions==4.16.0",
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "Flask>=3.1,<4",
]

[tool.setuptools.packages.find]
include = ["e2e_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"
